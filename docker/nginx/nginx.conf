# SSE-safe reverse proxy fronting the two api instances of the cluster profile.
#
# The honest part of horizontal SSE: a long-lived `text/event-stream` response is
# silently broken by the proxy defaults that help normal requests. This config
# disables response buffering and compression on the stream and sets a read
# timeout far above the app heartbeat, so events reach the client the instant the
# app writes them. Plain HTTP round-robins across both instances so the fan-out
# labs genuinely interleave. No secrets live here; instance addresses are the
# compose service names on the shared network.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  # Round-robin across the two api instances. Reaching either instance for plain
  # HTTP is what makes the cross-instance fan-out labs meaningful.
  upstream api_cluster {
    server app-a:3001;
    server app-b:3002;
  }

  # Forwarded headers shared by every proxied location.
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  server {
    listen 8080;
    server_name _;

    # SSE stream. Buffering or gzip on a streaming body defeats SSE, so both are
    # off; the read timeout sits far above the app heartbeat (default 10s) so an
    # idle-but-alive stream is never reset. HTTP/1.1 with an empty Connection
    # header keeps the upstream connection open for streaming.
    location /api/events {
      proxy_pass http://api_cluster;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_buffering off;
      proxy_cache off;
      gzip off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # WebSocket namespace. The upgrade + sticky-session block is added with the
    # WebSocket profile; until then the endpoint is intentionally closed so no
    # client mistakes a plain proxied path for a working socket.
    location /live {
      return 404;
    }

    # Everything else (REST, /health) round-robins across both instances.
    location / {
      proxy_pass http://api_cluster;
      proxy_http_version 1.1;
    }
  }
}
