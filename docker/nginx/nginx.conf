# SSE-safe, WebSocket-sticky reverse proxy fronting the two api instances.
#
# The honest part of horizontal realtime: a long-lived `text/event-stream` response
# is silently broken by the proxy defaults that help normal requests, and a
# Socket.IO connection that ever falls back to HTTP long-polling breaks without
# handshake affinity. This config disables response buffering and compression on
# the SSE stream, pins Socket.IO's transport endpoint to a single instance per
# client via `ip_hash`, and round-robins the remaining plain HTTP so the fan-out
# labs genuinely interleave. No secrets live here; instance addresses are the
# compose service names on the shared network.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  # Round-robin across the two api instances. Reaching either instance for plain
  # HTTP is what makes the cross-instance fan-out labs meaningful.
  upstream api_cluster {
    server app-a:3001;
    server app-b:3002;
  }

  # Sticky upstream for Socket.IO. The Redis adapter synchronizes messages between
  # instances but NOT handshake affinity: a Socket.IO session that starts on HTTP
  # long-polling makes several separate HTTP requests, and every one must reach the
  # instance that owns the session, or the handshake fails with a session-id
  # mismatch. `ip_hash` pins each client ip to one instance for the life of the
  # connection, which is the affinity long-polling needs. A pure-WebSocket client
  # (`transports: ['websocket']`, no polling fallback) does not need this because it
  # is a single upgraded connection, but the polling fallback is on by default, so
  # stickiness is mandatory here. The honest failure mode without it: intermittent
  # "Session ID unknown" handshake errors under load, not a clean outage.
  upstream api_cluster_sticky {
    ip_hash;
    server app-a:3001;
    server app-b:3002;
  }

  # Maps the presence of an Upgrade header to the Connection header value a
  # WebSocket upgrade requires, and to `close` for a plain request.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Forwarded headers shared by every proxied location.
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  server {
    listen 8080;
    server_name _;

    # SSE stream. Buffering or gzip on a streaming body defeats SSE, so both are
    # off; the read timeout sits far above the app heartbeat (default 10s) so an
    # idle-but-alive stream is never reset. HTTP/1.1 with an empty Connection
    # header keeps the upstream connection open for streaming.
    location /api/events {
      proxy_pass http://api_cluster;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_buffering off;
      proxy_cache off;
      gzip off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # Socket.IO transport endpoint. The configured namespace (`/live`) travels in
    # the handshake payload, not the URL, so the real HTTP/WebSocket path is
    # `/socket.io/`. It carries the upgrade headers a WebSocket needs and routes to
    # the sticky upstream so the polling fallback keeps its handshake affinity. The
    # read timeout sits above the ping timeout so an idle-but-alive socket is never
    # reset.
    location /socket.io/ {
      proxy_pass http://api_cluster_sticky;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # Everything else (REST, /health) round-robins across both instances.
    location / {
      proxy_pass http://api_cluster;
      proxy_http_version 1.1;
    }
  }
}
