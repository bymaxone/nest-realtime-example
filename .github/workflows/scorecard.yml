name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '30 1 * * 6'
  push:
    branches:
      - main

permissions: read-all

jobs:
  visibility:
    name: Repository visibility
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      public: ${{ steps.check.outputs.public }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail

          # Retried rather than trusted once: a rate limit or a blip would
          # otherwise decide whether the repository counts as public.
          visibility=""
          for attempt in 1 2 3; do
            visibility=$(gh api "repos/$REPO" --jq .visibility 2>/dev/null) && break
            sleep $(( attempt * 5 ))
          done

          if [ -z "$visibility" ]; then
            # Degrade to "not public" instead of failing the workflow. The scan
            # cannot run without knowing, and a red workflow over a transient API
            # error is noise; the warning keeps it from being silent.
            echo "::warning::Could not determine repository visibility after 3 attempts; treating it as non-public."
            echo "public=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "visibility: $visibility"
          if [ "$visibility" = "public" ]; then
            echo "public=true" >> "$GITHUB_OUTPUT"
          else
            # Covers internal as well as private: neither can publish results.
            echo "public=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipped on a $visibility repository."
          fi

  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # OpenSSF Scorecard evaluates a project's public supply-chain posture and
    # publishes results to the public scorecard.dev registry, which has no
    # meaning for a private repository. This workflow stays dormant while the
    # repository is private and activates automatically the moment it flips
    # public, which the visibility job below detects on any trigger.
    needs: visibility
    if: ${{ needs.visibility.outputs.public == 'true' }}
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          sarif_file: results.sarif
